<!DOCTYPE html>

<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#0a0a14;color:#ede4d4;font-family:"PingFang SC","Noto Serif SC","STSong","Songti SC",serif;min-height:100vh;overflow-x:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:210px;background:linear-gradient(180deg,#0d1025 0%,#0a0d1a 100%);border-right:1px solid rgba(180,160,120,.12);z-index:100;display:flex;flex-direction:column;padding:28px 0 20px}
.sidebar-brand{padding:0 22px 20px;font-size:17px;letter-spacing:.15em;color:#d4c8a0;text-align:center;border-bottom:1px solid rgba(180,160,120,.1);margin-bottom:16px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px;padding:0 10px}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;letter-spacing:.08em;color:rgba(200,180,150,.55);text-decoration:none;border-radius:6px;transition:all .25s}
.sidebar-nav a:hover{color:#d4c8a0;background:rgba(200,170,120,.06)}

.sidebar-subnav .subnav-label{padding:12px 14px 6px;font-size:11px;letter-spacing:.15em;color:rgba(180,160,120,.3)}
.sidebar-subnav a{display:flex;align-items:center;gap:6px;padding:5px 14px;font-size:12px;letter-spacing:.05em;color:rgba(180,150,120,.35);text-decoration:none;border-radius:4px;transition:all .2s;margin:1px 0}
.sidebar-subnav a:hover{color:#c8b890;background:rgba(200,170,120,.04)}
.sidebar-subnav a.active{color:#d4c8a0;background:rgba(200,170,120,.08);border:1px solid rgba(200,170,120,.15)}
.badge{padding:1px 6px;font-size:10px;letter-spacing:.1em;background:rgba(140,190,170,.15);color:#8cb8a8;border-radius:3px;margin-left:4px}
.sidebar-toggle{display:none;position:fixed;left:16px;top:16px;z-index:200;font-size:24px;color:rgba(200,170,130,.6);cursor:pointer;background:none;border:none;padding:6px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.body-wrap{margin-left:210px}
.hero{position:relative;text-align:center;padding:60px 20px 40px;background:linear-gradient(180deg,#0d1020 0%,#12182b 40%,#0a0a14 100%);border-bottom:1px solid rgba(180,160,120,.15);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 30% 60%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 55% 15%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 70% 40%,rgba(255,255,255,.3),transparent),radial-gradient(1.5px 1.5px at 85% 70%,rgba(255,255,255,.5),transparent);pointer-events:none}
.hero h1{position:relative;font-size:clamp(36px,6vw,56px);font-weight:300;letter-spacing:.15em;color:#e0d4b8;text-shadow:0 0 40px rgba(220,190,130,.35);margin-bottom:8px}
.hero .ep-title{position:relative;font-size:18px;letter-spacing:.3em;color:rgba(200,180,140,.55)}
.section-block{max-width:1400px;margin:0 auto;padding:0 24px}
.section-title{display:flex;align-items:center;gap:14px;margin:52px 0 24px}
.section-title:first-of-type{margin-top:36px}
.section-title .line{flex:1;height:1px;background:rgba(180,160,120,.2)}
.section-title h2{font-size:17px;font-weight:400;letter-spacing:.2em;color:rgba(210,190,160,.65);white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;align-items:start;padding-bottom:8px}
.card{position:relative;background:#111524;border:1px solid rgba(140,120,80,.2);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .3s}
.card:hover{transform:translateY(-3px);border-color:rgba(180,140,80,.4);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.card .img-container{width:100%;overflow:hidden;background:#0a0d16}
.card .img-container img{width:100%;height:auto;display:block;transition:transform .4s}
.card:hover img{transform:scale(1.02)}
.card .label{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(180deg,rgba(17,21,36,0) 0%,#111524 100%)}
.card .label .scene-name{font-size:15px;color:#d4c8a8;letter-spacing:.05em}
.card .label .scene-script{font-size:12px;color:rgba(210,190,160,.55);line-height:1.6;text-align:right}
.lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(5,5,15,.95);backdrop-filter:blur(10px);justify-content:center;align-items:center;flex-direction:column}
.lightbox.active{display:flex}
.lightbox img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:4px}
.lightbox .lb-info{margin-top:14px;font-size:15px;color:rgba(215,200,170,.75);text-align:center;max-width:700px;line-height:1.6}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:48px;color:rgba(215,200,170,.45);cursor:pointer;padding:20px;z-index:1001}
.lb-nav:hover{color:rgba(230,215,180,.9)}
.lb-prev{left:20px}.lb-next{right:20px}
.lightbox .lb-close{position:absolute;top:24px;right:36px;font-size:42px;color:rgba(215,200,170,.55);cursor:pointer}
.lightbox .lb-close:hover{color:rgba(230,215,180,.9)}
.footer{text-align:center;padding:50px 20px;font-size:13px;color:rgba(150,130,90,.35)}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:block}.sidebar-overlay.show{display:block}
  .body-wrap{margin-left:0}.gallery{grid-template-columns:1fr}
}
</style>

<script>

{file:"Z01_山门石桥_入口通道.png",name:"Z01 · 山门石桥入口",script:"外山门远眺——石桥横跨深谷，桥头矗立一对巨大石兽，远方王庭灯火初现",section:"🏯 外门与跨谷桥",zone:"Z01"},

{file:"Z01_外门石桥_俯瞰.png",name:"Z01 · 外门石桥俯瞰",script:"俯瞰跨谷桥全景——桥体横跨万丈深谷，两侧浓雾翻涌",section:"🏯 外门与跨谷桥",zone:"Z01"},

// ── Z02 前庭台地 ──
{file:"Z02_前庭台地_祭坛广场.png",name:"Z02 · 前庭台地祭坛",script:"外门后的圆形祭坛广场——黑石铺地、层层攀升的宫殿群",section:"🏛️ 前庭台地",zone:"Z02"},

// ── Z03 雪庭 ──
{file:"Z03_正殿前广场_中庭.png",name:"Z03 · 正殿前中庭",script:"正殿前中庭——柱廊围合、雪积中庭",section:"❄️ 雪庭",zone:"Z03"},
{file:"Z03_雪庭_夜审.png",name:"Z03 · 雪庭夜审",script:"月下雪庭——冰晶反光、幽蓝暗影，审判气氛",section:"❄️ 雪庭",zone:"Z03"},

// ── Z04 守灯长廊 ──
{file:"Z04_守灯长廊_雪娘与猫.png",name:"Z04 · 守灯长廊",script:"沿崖壁蜿蜒的长廊——雪娘与猫，灯笼温暖",section:"🌉 守灯长廊",zone:"Z04"},
{file:"Z04_悬崖回廊_月下.png",name:"Z04 · 悬崖回廊月下",script:"月下悬崖回廊——冷光斜照，栏外深谷",section:"🌉 守灯长廊",zone:"Z04"},
{file:"R01-SC1_守灯长廊栏内外统一连续版_v001.png",name:"R01-SC1 · 栏内外连续",script:"长廊栏内外空间连续性锚点——栏内通路与栏外悬台的统一关系",section:"🌉 守灯长廊",zone:"Z04"},
{file:"R01-SC3_栏外薄冰重瓦悬台_连续性锚点_v001.png",name:"R01-SC3 · 栏外薄冰悬台",script:"栏外薄冰、重瓦、悬台连续性——悬崖百尺下的檐口结构",section:"🌉 守灯长廊",zone:"Z04"},

// ── Z05 白狐正堂 ──
{file:"Z05_白狐正堂_祖殿.png",name:"Z05 · 白狐正堂祖殿",script:"中轴对称祭殿内庭——中央多层塔形香炉、巨柱云纹、天井冷月",section:"🏛️ 白狐正堂",zone:"Z05"},
{file:"Z05_王府宴会厅_长案.png",name:"Z05 · 宴会厅长案",script:"深色旧木梁柱厅堂——黑漆长案两侧高背椅，暗刻九尾纹隐于柱屏",section:"🏛️ 白狐正堂",zone:"Z05"},

// ── Z06 王座大厅 ──
{file:"Z06_王座大厅_九尾.png",name:"Z06 · 王座大厅九尾",script:"王座大厅全景——巨柱撑天，九尾王座居中高台，冷光穿堂",section:"👑 王座大厅",zone:"Z06"},
{file:"06_Z06白狐正堂_审判人物站位_候选v001.png",name:"Z06 · 审判人物站位",script:"五人调度——王嵩独坐王座、雪娘中轴、青禾悬缚、阿檀跪、玄晏站",section:"👑 王座大厅",zone:"Z06"},
{file:"07_Z06白狐正堂_审判证物落位_候选v001.png",name:"Z06 · 审判证物落位",script:"石台上全部证物——药囊·三枚寒骨药·族谱·护灯契·牌位·竹笼猫",section:"👑 王座大厅",zone:"Z06"},

{file:"Z07_屋脊追逐_青禾出逃.png",name:"Z07 · 屋脊夜雪追逐",script:"青禾跃上屋脊出逃——赤足踏黑瓦薄冰，身后追兵、远山月照",section:"⚔️ 屋脊巡防",zone:"Z07"},

// ── Z08 灶房 ──
{file:"Z08_王府灶房_藏猫.png",name:"Z08 · 灶房藏猫",script:"王府灶房一隅——灶火暖光、旧木橱柜、小花猫藏身之处",section:"🔥 灶房与后场",zone:"Z08"},

// ── Z09 山体洞厅 ──
{file:"Z09_山体洞厅_地底密道.png",name:"Z09 · 山体洞厅密道",script:"山体内部洞厅——天井冷光垂落，古桥横跨暗河，密道幽深",section:"🕳️ 山体洞厅",zone:"Z09"},

// ── Z10 绝壁飞廊 ──
{file:"Z10_绝壁飞廊_栈道.png",name:"Z10 · 绝壁飞廊栈道",script:"悬崖间的悬空飞廊——依山势蜿蜒，谷底云雾与瀑布环绕",section:"💧 绝壁飞廊",zone:"Z10"},

// ── 水系连续锚点 ──
{file:"R02-SC2_水幕下游引水道_连续性锚点_v001.png",name:"R02-SC2 · 水幕下游引水道",script:"水幕下游引水道连续性——瀑布水系的完整空间关系",section:"💧 绝壁飞廊",zone:"Z10"},
];

const root=document.getElementById("content-root");
const doneSections=new Set();let secIdx=0;
scenes.forEach((sc,i)=>{
const sec=sc.section;
if(!doneSections.has(sec)){
doneSections.add(sec);const block=document.createElement("div");block.className="section-block";block.id="sec-"+secIdx;secIdx++;
const title=document.createElement("div");title.className="section-title";
const count=scenes.filter(s=>s.section===sec).length;
title.innerHTML=`<div class="line"></div><h2>▎${sec} <span style="font-size:12px;color:rgba(180,160,120,.35);letter-spacing:.06em">${count} 景</span></h2><div class="line"></div>`;block.appendChild(title);
const gallery=document.createElement("div");gallery.className="gallery";gallery.setAttribute("data-section",sec);block.appendChild(gallery);root.appendChild(block);
}
const gal=root.querySelector(`[data-section="${sec}"]`);
const card=document.createElement("div");card.className="card";card.setAttribute("data-index",i);
card.innerHTML=`<div class="img-container"><img src="${sc.file}" alt="${sc.name}" loading="lazy"></div><div class="label"><div class="scene-name">${sc.name}</div><div class="scene-script">${sc.script}</div></div>`;
card.addEventListener("click",()=>openLightbox(i));gal.appendChild(card);
});
const subnav=document.getElementById("subnav"),sections=[];subnav.innerHTML='<div class="subnav-label">分区</div>';
doneSections.forEach(sec=>{const id="sec-"+sections.length;sections.push({id,sec});const a=document.createElement("a");a.href="#"+id;a.textContent=sec;subnav.appendChild(a)});
function updateActiveNav(){const els=subnav.querySelectorAll("a");let active=0;for(let i=els.length-1;i>=0;i--){const s=document.getElementById("sec-"+i);if(s&&s.getBoundingClientRect().top<window.innerHeight*.7){active=i;break}}els.forEach((a,i)=>{a.classList.toggle("active",i===active)})}
window.addEventListener("scroll",updateActiveNav,{passive:true});updateActiveNav();
const lightbox=document.getElementById("lightbox"),lbImg=document.getElementById("lbImg"),lbInfo=document.getElementById("lbInfo");let cur=0;
function openLightbox(i){cur=i;updateLb();lightbox.classList.add("active");document.body.style.overflow="hidden"}
function closeLightbox(){lightbox.classList.remove("active");document.body.style.overflow=""}
function updateLb(){var s=scenes[cur];lbImg.src=s.file;lbInfo.innerHTML=`<b>${s.name}</b> · ${cur+1}/${scenes.length}<br><span style="font-size:13px;color:rgba(180,160,120,.5)">${s.script}</span>`}
function prev(){cur=(cur-1+scenes.length)%scenes.length;updateLb()}function next(){cur=(cur+1)%scenes.length;updateLb()}
document.getElementById("lbClose").addEventListener("click",closeLightbox);document.getElementById("lbPrev").addEventListener("click",e=>{e.stopPropagation();prev()});document.getElementById("lbNext").addEventListener("click",e=>{e.stopPropagation();next()});lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLightbox()});document.addEventListener("keydown",e=>{if(!lightbox.classList.contains("active"))return;if(e.key==="Escape")closeLightbox();if(e.key==="ArrowLeft")prev();if(e.key==="ArrowRight")next()});
function toggleSidebar(){var s=document.getElementById("sidebar"),o=document.getElementById("sidebarOverlay");s.classList.toggle("open");o.classList.toggle("show")}
</script>
