<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>狐祖归来 · 场景视觉统一评选</title>
<style>
:root{
  --bg:#0a0a14; --card:#111524; --text:#e0d8c8; --muted:rgba(200,180,140,.45);
  --head:#d4c8a8; --line:rgba(180,160,120,.15); --gold:rgba(220,180,100,.75);
  --a:#7eb8d4; --b:#d4a06a; --c:#b08cd4; --d:#8cba7a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Noto Serif SC",serif;line-height:1.5}
a{color:var(--gold);text-decoration:none}
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;overflow-y:auto;
  background:#0d1020;border-right:1px solid var(--line);padding:16px 0 48px;z-index:20}
.brand{padding:8px 16px 14px;font-size:13px;letter-spacing:.12em;color:var(--head)}
.brand small{display:block;margin-top:6px;font-size:11px;color:var(--muted);letter-spacing:.03em}
.filters{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.filters label{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(220,200,160,.7);
  padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.filters label.on{border-color:rgba(220,180,100,.45);color:var(--head);background:rgba(180,150,100,.06)}
.filters input{accent-color:#c9a45c}
.nav-sec{font-size:11px;letter-spacing:.1em;color:var(--muted);padding:10px 16px 4px}
.sidebar a.nav{display:block;padding:6px 16px;font-size:12px;color:rgba(220,200,160,.55);
  border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar a.nav:hover,.sidebar a.nav.active{color:var(--head);background:rgba(180,150,100,.06);
  border-left-color:rgba(220,180,100,.55)}
.main{margin-left:240px;flex:1;min-width:0;padding:24px 24px 80px}
.hero{max-width:1400px;margin:0 auto 18px}
.hero h1{margin:0 0 8px;font-size:clamp(22px,3.4vw,36px);font-weight:500;letter-spacing:.1em;color:var(--head)}
.hero p{margin:0 0 6px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.a{color:var(--a);border-color:rgba(126,184,212,.35)}
.chip.b{color:var(--b);border-color:rgba(212,160,106,.35)}
.chip.c{color:var(--c);border-color:rgba(176,140,212,.35)}
.chip.d{color:var(--d);border-color:rgba(140,186,122,.35)}
.toolbar{max-width:1400px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  position:sticky;top:8px;z-index:10}
.toolbar input[type=search]{flex:1;min-width:160px;background:#0a0d16;border:1px solid var(--line);
  color:var(--text);border-radius:6px;padding:7px 10px;font-size:13px}
.toolbar button{font-size:12px;color:var(--head);background:transparent;border:1px solid var(--line);
  border-radius:6px;padding:7px 11px;cursor:pointer}
.toolbar button:hover{border-color:rgba(220,180,100,.45)}
.toolbar button.primary{background:rgba(220,180,100,.12);border-color:rgba(220,180,100,.35)}
#selCount{margin-left:auto;color:var(--gold);font-size:13px}
.batch{max-width:1400px;margin:0 auto 40px;scroll-margin-top:70px}
.batch.hidden{display:none}
.batch-head{border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.batch-head h2{margin:0 0 4px;font-size:18px;font-weight:500;color:var(--head);letter-spacing:.06em}
.batch-head .sub{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative;
  transition:border-color .15s, transform .15s}
.card:hover{border-color:rgba(220,180,100,.35);transform:translateY(-1px)}
.card.selected{border-color:rgba(220,180,100,.75);box-shadow:0 0 0 1px rgba(220,180,100,.25)}
.card.hidden{display:none}
.card .img-wrap{aspect-ratio:16/10;background:#0a0d16;cursor:zoom-in;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:9px 11px 11px}
.card .code{font-size:11px;letter-spacing:.08em;margin-bottom:2px}
.card .code.a{color:var(--a)}.card .code.b{color:var(--b)}.card .code.c{color:var(--c)}.card .code.d{color:var(--d)}
.card .title{font-size:13px;color:var(--head)}
.card .pick{position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;gap:5px;
  background:rgba(10,10,20,.75);border:1px solid rgba(180,160,120,.25);border-radius:999px;
  padding:4px 9px;font-size:11px;color:var(--head);backdrop-filter:blur(6px);cursor:pointer}
.card .pick input{accent-color:#c9a45c}
.panel{max-width:1400px;margin:20px auto 0;padding:16px;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--head)}
#picks{font-size:12px;color:rgba(224,216,200,.8);white-space:pre-wrap;min-height:36px}
.foot{max-width:1400px;margin:24px auto 0;text-align:center;color:var(--muted);font-size:12px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;
  z-index:100;padding:20px;flex-direction:column;gap:10px}
.lb.open{display:flex}
.lb img{max-width:min(96vw,1600px);max-height:84vh;object-fit:contain;border-radius:6px}
.lb .cap{color:var(--head);font-size:13px}
.lb .close{position:absolute;top:16px;right:20px;font-size:28px;color:#fff;cursor:pointer;opacity:.7}
@media(max-width:980px){.sidebar{display:none}.main{margin-left:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">狐祖 · 统一评选<small>四批对照 · 勾选导出</small></div>
    <div class="filters" id="filters"></div>
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="hero">
      <h1>场景视觉统一评选</h1>
      <p>A 山水 V2.0（50）· B EP01 V1.2（25）· C 志怪电影帧 V3.0（50）· D EP01 Fable V1.4（25）</p>
      <p>引擎：Seedream 5.0 Pro · 1920×1080 · 可筛选批次 / 搜索 / 勾选导出</p>
      <div class="chips">
        <span class="chip a">A 山水 50</span>
        <span class="chip b">B EP01 V1.2 25</span>
        <span class="chip c">C 志怪 V3.0 50</span>
        <span class="chip d">D Fable V1.4 25</span>
        <span class="chip">共 150 图</span>
      </div>
    </div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="搜索编号 / 场景名…" oninput="applyFilter()" />
      <button onclick="selectVisible()">全选当前可见</button>
      <button onclick="clearPicks()">清空</button>
      <button class="primary" onclick="exportPicks()">导出评选</button>
      <span id="selCount">已选 0</span>
    </div>
    <div id="content"></div>
    <div class="panel">
      <h3>当前评选</h3>
      <div id="picks">尚未勾选。</div>
    </div>
    <div class="foot">foxmuldery.github.io · 本地 originals/thumbs · 2026-08-13</div>
  </main>
</div>
<div class="lb" id="lb" onclick="if(event.target===this)closeLb()">
  <div class="close" onclick="closeLb()">×</div>
  <img id="lbImg" alt="" />
  <div class="cap" id="lbCap"></div>
</div>
<script>
let DATA = null;
const picks = new Set(); // bid|code
const active = new Set(["A","B","C","D"]);

async function boot(){
  const r = await fetch("data.json?v=1");
  DATA = await r.json();
  renderFilters();
  render();
}
function renderFilters(){
  const box = document.getElementById("filters");
  box.innerHTML = "";
  DATA.batches.forEach(b=>{
    const lab = document.createElement("label");
    lab.className = active.has(b.id) ? "on" : "";
    lab.innerHTML = `<input type="checkbox" ${active.has(b.id)?"checked":""} onchange="toggleBatch('${b.id}', this.checked)"><span>${b.name}（${b.count}）</span>`;
    box.appendChild(lab);
  });
}
function toggleBatch(id, on){
  if(on) active.add(id); else active.delete(id);
  renderFilters();
  applyFilter();
}
function render(){
  const nav = document.getElementById("nav");
  const root = document.getElementById("content");
  nav.innerHTML = ""; root.innerHTML = "";
  DATA.batches.forEach(b=>{
    const sec = document.createElement("div");
    sec.className = "nav-sec"; sec.textContent = b.id + " · " + b.count;
    nav.appendChild(sec);
    b.items.slice(0, 12).forEach(it=>{
      const a = document.createElement("a");
      a.className = "nav";
      a.href = "#"+b.id+"-"+it.code;
      a.textContent = it.code + " " + it.title;
      nav.appendChild(a);
    });
    if(b.items.length>12){
      const more = document.createElement("div");
      more.className = "nav-sec";
      more.textContent = "…共 "+b.items.length+" 条";
      nav.appendChild(more);
    }

    const batch = document.createElement("section");
    batch.className = "batch"; batch.id = "batch-"+b.id;
    batch.dataset.bid = b.id;
    batch.innerHTML = `<div class="batch-head"><h2>${b.name}</h2><div class="sub">${b.sub}</div></div>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    b.items.forEach(it=>{
      const key = b.id+"|"+it.code;
      const card = document.createElement("div");
      card.className = "card"+(picks.has(key)?" selected":"");
      card.dataset.key = key;
      card.dataset.bid = b.id;
      card.dataset.code = it.code;
      card.dataset.title = it.title;
      card.id = b.id+"-"+it.code;
      const thumb = "thumbs/"+it.thumb;
      const full = "full/"+it.src.replace(/\.png$/,".jpg");
      card.innerHTML =
        `<label class="pick"><input type="checkbox" ${picks.has(key)?"checked":""} onchange="togglePick(this,'${key}')">选</label>`+
        `<div class="img-wrap" onclick="openLb('${full}','${b.id} ${it.code} · ${escapeHtml(it.title)}')"><img loading="lazy" src="${thumb}" alt="${it.code}"></div>`+
        `<div class="meta"><div class="code ${b.id.toLowerCase()}">${b.id} · ${it.code}</div><div class="title">${escapeHtml(it.title)}</div></div>`;
      grid.appendChild(card);
    });
    batch.appendChild(grid);
    root.appendChild(batch);
  });
  applyFilter();
  updateCount();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function togglePick(el, key){
  const card = document.querySelector('.card[data-key="'+key+'"]');
  if(el.checked){ picks.add(key); card&&card.classList.add("selected"); }
  else { picks.delete(key); card&&card.classList.remove("selected"); }
  updateCount();
}
function selectVisible(){
  document.querySelectorAll(".card:not(.hidden)").forEach(c=>{
    picks.add(c.dataset.key);
    c.classList.add("selected");
    const inp = c.querySelector('input[type=checkbox]');
    if(inp) inp.checked = true;
  });
  updateCount();
}
function clearPicks(){
  picks.clear();
  document.querySelectorAll(".card.selected").forEach(c=>c.classList.remove("selected"));
  document.querySelectorAll('.card input[type=checkbox]').forEach(i=>i.checked=false);
  updateCount();
}
function applyFilter(){
  const q = (document.getElementById("q").value||"").trim().toLowerCase();
  DATA.batches.forEach(b=>{
    const batchEl = document.getElementById("batch-"+b.id);
    if(!batchEl) return;
    const showBatch = active.has(b.id);
    batchEl.classList.toggle("hidden", !showBatch);
    if(!showBatch) return;
    batchEl.querySelectorAll(".card").forEach(c=>{
      const hay = (c.dataset.code+" "+c.dataset.title).toLowerCase();
      const ok = !q || hay.includes(q);
      c.classList.toggle("hidden", !ok);
    });
  });
}
function updateCount(){
  document.getElementById("selCount").textContent = "已选 "+picks.size;
  const lines = [];
  [...picks].sort().forEach(k=>{
    const [bid, code] = k.split("|");
    const b = DATA.batches.find(x=>x.id===bid);
    const it = b && b.items.find(x=>x.code===code);
    lines.push(`${bid} · ${code} · ${(it&&it.title)||""}`);
  });
  document.getElementById("picks").textContent = lines.length ? lines.join("\n") : "尚未勾选。";
}
function exportPicks(){
  const lines = ["# 狐祖场景视觉统一评选","","时间："+new Date().toLocaleString("zh-CN"),"",
    "| 批次 | 编号 | 标题 |","|---|---|---|"];
  [...picks].sort().forEach(k=>{
    const [bid, code] = k.split("|");
    const b = DATA.batches.find(x=>x.id===bid);
    const it = b && b.items.find(x=>x.code===code);
    lines.push(`| ${bid} ${b?b.name:""} | ${code} | ${(it&&it.title)||""} |`);
  });
  if(!picks.size) lines.push("","（空）");
  const blob = new Blob([lines.join("\n")], {type:"text/markdown;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "狐祖_场景视觉统一评选.md";
  a.click();
  URL.revokeObjectURL(a.href);
}
function openLb(src, cap){
  document.getElementById("lbImg").src = src;
  document.getElementById("lbCap").textContent = cap;
  document.getElementById("lb").classList.add("open");
}
function closeLb(){ document.getElementById("lb").classList.remove("open"); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeLb(); });
boot();
</script>
</body>
</html>
