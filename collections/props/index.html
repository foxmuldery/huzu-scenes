.footer{text-align:center;padding:50px 20px 50px;font-size:14px;letter-spacing:.1em;color:rgba(170,150,110,.4)}

/* ── 分类导航条 ── */
.cat-nav{max-width:1100px;margin:0 auto;padding:16px 24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

.cat-nav a:hover,.cat-nav a.active{color:#d4c8a8;border-color:rgba(200,170,120,.4);background:rgba(180,150,100,.06)}

@media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}.main-content{margin-left:0}.sidebar{display:none}}

const root=document.getElementById("content-root");
const sidebarNav=document.getElementById("sidebarNav");
const catNav=document.getElementById("catNav");
const doneKeys=new Set(),catFirstId={};
let secIdx=0;
scenes.forEach((sc,i)=>{
const cat=sc.cat||"",sec=sc.section,key=cat+"|||"+sec;
if(!doneKeys.has(cat)){
doneKeys.add(cat);
// 侧边栏分类头
const catDiv=document.createElement("div");catDiv.className="nav-cat";catDiv.textContent=cat;sidebarNav.appendChild(catDiv);
}
if(!doneKeys.has(key)){
doneKeys.add(key);
secIdx++;
const secId="sec-"+secIdx;
if(!catFirstId[cat]) catFirstId[cat]=secId;
const block=document.createElement("div");block.className="section-block";block.id=secId;
const title=document.createElement("div");title.className="section-title";
title.innerHTML=`<div class="line"></div><h2>▎${sec}</h2><div class="line"></div>`;
block.appendChild(title);
const gallery=document.createElement("div");gallery.className="gallery";
gallery.setAttribute("data-key",key);
block.appendChild(gallery);
root.appendChild(block);
// 侧边栏子链接
const li=document.createElement("li");
li.innerHTML=`<a href="#${secId}" class="nav-sub">${sec}</a>`;
sidebarNav.appendChild(li);
}
const gal=root.querySelector(`[data-key="${key}"]`);
const card=document.createElement("div");card.className="card";
card.setAttribute("data-index",i);
card.innerHTML=`<div class="img-container"><img src="${sc.file}" alt="${sc.name}" loading="lazy"></div><button class="copy-btn" title="复制描述" onclick="event.stopPropagation();copyScene(this,'${sc.script.replace(/'/g,"\\'")}')">📋</button><div class="label"><div style="text-align:right;min-width:0;"><div class="scene-name">${sc.name}</div><div class="scene-script">${sc.script}</div></div></div>`;
card.addEventListener("click",()=>openLightbox(i));
gal.appendChild(card);
});

// 顶部分类导航
Object.entries(catFirstId).forEach(([cat,id])=>{
const a=document.createElement("a");a.href="#"+id;a.textContent=cat;catNav.appendChild(a);
});

// 复制功能
function copyScene(btn,text){
navigator.clipboard.writeText(text).then(()=>{
btn.classList.add("copied");btn.textContent="✓";
setTimeout(()=>{btn.classList.remove("copied");btn.textContent="📋"},1500);
});
}

const lightbox=document.getElementById("lightbox"),lbImg=document.getElementById("lbImg"),lbInfo=document.getElementById("lbInfo");
let cur=0;
function openLightbox(i){cur=i;updateLb();lightbox.classList.add("active");document.body.style.overflow="hidden"}
function closeLightbox(){lightbox.classList.remove("active");document.body.style.overflow=""}
function updateLb(){var s=scenes[cur];lbImg.src=s.file;lbImg.alt=s.name;lbInfo.innerHTML=`<b>${s.name}</b> &nbsp;·&nbsp; ${cur+1}/${scenes.length}<br><span style="font-size:14px;color:rgba(210,190,160,.55)">${s.script}</span>`}
function prev(){cur=(cur-1+scenes.length)%scenes.length;updateLb()}
function next(){cur=(cur+1)%scenes.length;updateLb()}
document.getElementById("lbClose").addEventListener("click",closeLightbox);
document.getElementById("lbPrev").addEventListener("click",e=>{e.stopPropagation();prev()});
document.getElementById("lbNext").addEventListener("click",e=>{e.stopPropagation();next()});
lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLightbox()});
document.addEventListener("keydown",e=>{if(!lightbox.classList.contains("active"))return;if(e.key==="Escape")closeLightbox();if(e.key==="ArrowLeft")prev();if(e.key==="ArrowRight")next()});
</script>
</div>
