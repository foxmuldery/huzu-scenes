<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>狐祖归来 · 分镜故事板</title>
<style>
/* ===== RESET & BASE ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Noto Serif SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#0a0a14;color:#e0d8c8;line-height:1.6;overflow-x:hidden}

/* ===== PASSWORD GATE ===== */
.pw-gate{position:fixed;inset:0;z-index:9999;background:rgba(6,6,18,.96);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.pw-gate.hidden{display:none}
.pw-gate h1{font-size:28px;letter-spacing:.15em;color:#d4c8a8;font-weight:400}
.pw-gate .pw-box{display:flex;gap:8px}
.pw-gate input{width:220px;padding:10px 16px;font-size:15px;background:#111524;
  border:1px solid rgba(180,160,120,.25);border-radius:4px;color:#e0d4b8;outline:none;
  font-family:inherit;letter-spacing:.08em}
.pw-gate input:focus{border-color:rgba(200,170,120,.5)}
.pw-gate button{padding:10px 24px;font-size:14px;background:rgba(180,150,100,.15);
  border:1px solid rgba(180,150,100,.35);border-radius:4px;color:#d4c8a8;
  cursor:pointer;letter-spacing:.1em;font-family:inherit;transition:all .25s}
.pw-gate button:hover{background:rgba(200,170,120,.25);border-color:rgba(200,170,120,.5)}
.pw-error{font-size:12px;color:#c06050;min-height:18px;letter-spacing:.05em}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh}
.main{flex:1;min-width:0;margin-left:210px}

/* ===== SIDEBAR ===== */
.sidebar{position:fixed;top:0;left:0;width:210px;height:100vh;background:#0d1020;
  border-right:1px solid rgba(180,160,120,.12);z-index:100;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-header{padding:22px 16px 14px;border-bottom:1px solid rgba(180,160,120,.1);text-align:center}
.sidebar-header .logo{font-size:18px;letter-spacing:.12em;color:#e0d4b8}
.sidebar-header .ver{font-size:11px;color:rgba(180,150,110,.35);margin-top:4px;letter-spacing:.06em}
.sidebar-nav{flex:1;padding:6px 0;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;
  color:rgba(200,180,140,.45);text-decoration:none;border-left:2px solid transparent;transition:all .25s}
.sidebar-nav a:hover{color:rgba(230,210,160,.8);background:rgba(200,170,120,.05)}
.sidebar-nav a.active{color:#e0d4b8;background:rgba(200,170,120,.1);border-left-color:rgba(200,170,120,.6)}
.sidebar-nav a .nav-num{font-size:10px;color:rgba(180,150,110,.25);background:rgba(180,160,120,.06);
  padding:1px 6px;border-radius:8px;margin-left:auto}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(180,160,120,.1);font-size:10px;
  color:rgba(180,150,110,.3);text-align:center;letter-spacing:.06em}

/* ===== MOBILE ===== */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:200;width:36px;height:36px;
  background:#111524;border:1px solid rgba(180,160,120,.2);border-radius:6px;cursor:pointer}
.hamburger span{display:block;width:18px;height:1.5px;background:rgba(200,170,120,.6);margin:3px auto}
@media(max-width:900px){
  .sidebar{display:none}.main{margin-left:0}
  .hamburger{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .sidebar.mobile-open{display:flex!important;position:fixed;z-index:150;width:220px;box-shadow:4px 0 30px rgba(0,0,0,.8)}
}

/* ===== HERO ===== */
.hero{padding:56px 40px 32px;text-align:center;border-bottom:1px solid rgba(180,160,120,.08)}
.hero h1{font-size:42px;letter-spacing:.12em;color:#e0d4b8;font-weight:400;margin-bottom:8px}
.hero .sub{font-size:14px;color:rgba(200,170,130,.4);letter-spacing:.08em}

/* ===== SCENE SECTION ===== */
.scene-section{padding:32px 40px 0}
.scene-header{margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(180,160,120,.1)}
.scene-header h2{font-size:22px;color:#d4c8a8;font-weight:400;letter-spacing:.06em}
.scene-header .meta{font-size:12px;color:rgba(180,150,110,.4);margin-top:4px;letter-spacing:.04em}

/* ===== SCRIPT EXCERPT ===== */
.script-box{margin-bottom:24px;padding:18px 22px;background:rgba(200,170,120,.03);
  border-left:2px solid rgba(180,150,100,.2);border-radius:0 4px 4px 0;font-size:13px;
  color:rgba(200,180,140,.5);line-height:1.8;max-height:200px;overflow-y:auto;
  position:relative;letter-spacing:.04em}
.script-box.expanded{max-height:none}
.script-toggle{font-size:11px;color:rgba(180,150,100,.4);cursor:pointer;margin-top:6px;
  letter-spacing:.06em;transition:color .25s}
.script-toggle:hover{color:rgba(220,190,130,.7)}
.script-copy{position:absolute;top:12px;right:16px;font-size:11px;color:rgba(180,150,100,.35);
  cursor:pointer;padding:4px 12px;border:1px solid rgba(180,150,100,.15);border-radius:3px;
  background:transparent;transition:all .25s;letter-spacing:.06em;font-family:inherit}
.script-copy:hover{color:rgba(220,190,130,.7);border-color:rgba(180,150,100,.35)}
.script-copy.copied{color:#6ec9a8;border-color:rgba(110,201,168,.4);background:rgba(110,201,168,.06)}

/* ===== STORYBOARD GRID ===== */
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:24px;padding-bottom:40px}
.shot-card{background:#0f1224;border:1px solid rgba(180,160,120,.08);border-radius:6px;
  overflow:hidden;transition:border-color .3s,transform .2s;cursor:pointer}
.shot-card:hover{border-color:rgba(200,170,120,.2);transform:translateY(-2px)}
.shot-card .shot-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#0a0a18}
.shot-card .shot-info{padding:14px 16px}
.shot-card .shot-num{font-size:18px;color:#d4c8a8;letter-spacing:.04em;margin-bottom:6px}
.shot-card .shot-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.shot-badge{font-size:10px;padding:2px 8px;border-radius:3px;letter-spacing:.04em;
  background:rgba(180,160,120,.08);color:rgba(200,180,140,.5)}
.shot-badge.type{background:rgba(180,150,100,.12);color:rgba(220,190,130,.7)}
.shot-badge.angle{background:rgba(140,160,180,.1);color:rgba(160,190,210,.6)}
.shot-badge.move{background:rgba(160,140,180,.1);color:rgba(190,170,210,.6)}
.shot-card .shot-dialogue{font-size:12px;color:rgba(200,180,140,.45);margin-top:6px;
  padding-top:8px;border-top:1px solid rgba(180,160,120,.06);letter-spacing:.04em;
  font-style:italic;min-height:20px}
.shot-card .shot-desc{font-size:11px;color:rgba(180,160,130,.35);margin-top:4px;letter-spacing:.03em}

/* ===== LIGHTBOX ===== */
.lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(4,4,14,.94);
  align-items:center;justify-content:center;flex-direction:column;gap:16px}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:85vh;object-fit:contain;border-radius:4px;
  box-shadow:0 4px 40px rgba(0,0,0,.6)}
.lightbox .lb-info{font-size:13px;color:rgba(200,180,140,.5);text-align:center;letter-spacing:.04em}
.lightbox .lb-close{position:absolute;top:20px;right:28px;font-size:28px;
  color:rgba(200,170,120,.5);cursor:pointer;transition:color .25s;line-height:1}
.lightbox .lb-close:hover{color:rgba(240,210,160,.8)}
.lightbox .lb-nav{font-size:36px;color:rgba(200,170,120,.35);cursor:pointer;
  position:absolute;top:50%;transform:translateY(-50%);transition:color .25s;user-select:none}
.lightbox .lb-nav:hover{color:rgba(240,210,160,.7)}
.lightbox .lb-prev{left:24px}
.lightbox .lb-next{right:24px}

/* ===== EMPTY STATE ===== */
.empty-state{padding:80px 40px;text-align:center}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-state p{font-size:15px;color:rgba(180,150,110,.35);letter-spacing:.06em}
.empty-state .hint{font-size:12px;color:rgba(180,150,110,.2);margin-top:8px;letter-spacing:.04em}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0a0a14}
::-webkit-scrollbar-thumb{background:rgba(180,160,120,.15);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(180,160,120,.25)}
</style>
</head>
<body>

<!-- ===== PASSWORD GATE ===== -->
<div class="pw-gate" id="pwGate">
  <h1>狐祖归来 · 分镜故事板</h1>
  <div class="pw-box">
    <input type="password" id="pwInput" placeholder="输入访问密码" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">进入</button>
  </div>
  <div class="pw-error" id="pwError"></div>
</div>

<!-- ===== HAMBURGER ===== -->
<button class="hamburger" id="hamburger" onclick="toggleSidebar()">
  <span></span><span></span><span></span>
</button>

<!-- ===== APP LAYOUT ===== -->
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">狐祖归来</div>
    <div class="ver">分镜故事板</div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <a href="#top" data-section="top">
      <span class="nav-emoji">🎬</span>总览
    </a>
  </nav>
  <div class="sidebar-footer" id="sidebarFooter">0 场 · 0 镜</div>
</aside>

<main class="main">
  <div id="top"></div>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <h1>分镜故事板</h1>
    <p class="sub">狐祖归来 · 影视分镜预览</p>
  </section>

  <!-- ===== SCENE SECTIONS (JS-generated) ===== -->
  <div id="sceneContainer">
    <div class="empty-state" id="emptyState">
      <div class="icon">🎞️</div>
      <p>暂无分镜资产</p>
      <p class="hint">生成分镜图并入库后，将在此展示</p>
    </div>
  </div>

</main>
</div>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <span class="lb-close" onclick="closeLightbox()">&times;</span>
  <span class="lb-nav lb-prev" onclick="event.stopPropagation();navLightbox(-1)">‹</span>
  <img id="lbImg" src="" alt="" onclick="event.stopPropagation()">
  <div class="lb-info" id="lbInfo"></div>
  <span class="lb-nav lb-next" onclick="event.stopPropagation();navLightbox(1)">›</span>
</div>

<script>
// ===== PASSWORD GATE =====
var PW_HASH="019be397cf10ba2e242d7507db0852b1dcab423c62bd150024ef1333a68136aa";
var PW_KEY = "storyboard_auth";

async function sha256(m){var b=new TextEncoder().encode(m);var h=await crypto.subtle.digest("SHA-256",b);
  return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,"0")).join("")}

async function checkPw(){
  var input=document.getElementById("pwInput").value;
  var hash=await sha256(input);
  if(hash===PW_HASH){sessionStorage.setItem(PW_KEY,"1");document.getElementById("pwGate").classList.add("hidden")}
  else{document.getElementById("pwError").textContent="密码错误，请重试"}
}

if(sessionStorage.getItem(PW_KEY)==="1")document.getElementById("pwGate").classList.add("hidden");

// ===== STORYBOARD DATA =====
// 每场: {id, title, scene_num, script, shots: [{file, shot_type, camera_angle, camera_movement, dialogue, description_zh, duration}]}
var STORYBOARD_DATA = [
  {
    id: "xueyedengdeng", title: "雪夜点灯", scene_num: 1,
    script: "雪夜，古寺廊道。侍女雪娘蹲跪点灯，怀中藏一小猫。四名银甲白发巡卫列队行过，龙纹石柱暖光映雪，远山宫殿灯火阑珊。",
    shots: [
      {id:1, file:"雪夜点灯_01_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"雪夜寺庙长廊，侍女蹲跪点灯，怀中藏小猫，白发侍卫列队巡行", duration:5},
      {id:2, file:"雪夜点灯_02_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"悬崖廊道全景，女子点灯，银甲白发侍卫迎面走来，远方雪山宫殿灯火", duration:5},
      {id:3, file:"雪夜点灯_03_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"侍女跪地点灯，白发侍卫持械巡逻，龙纹石柱暖光与雪夜冷色对比", duration:4},
      {id:4, file:"雪夜点灯_04_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"积雪廊道，侍女为青铜油灯添油，侍卫队列从远处走来", duration:4},
      {id:5, file:"雪夜点灯_05_近景_平拍.png", shot_type:"近景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"女子在石灯笼前俯身点灯，灯光照亮面庞，雪花飘落", duration:3},
      {id:6, file:"雪夜点灯_06_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"寺院回廊夜景，灯笼暖光与冷蓝雪夜交融，远处宫殿隐现", duration:4},
      {id:7, file:"雪夜点灯_07_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"积雪覆盖的古代廊道，石栏雕花，暖黄灯影沿廊延伸", duration:4},
      {id:8, file:"雪夜点灯_08_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"宫殿走道雪夜景，龙柱雕纹，远山宫殿灯火，飞雪漫天", duration:4}
    ]
  },
  {
    id: "xuanyataowang", title: "悬崖逃亡", scene_num: 2,
    script: "受伤男子紧抱布囊，攀爬悬崖峭壁。瀑布水雾间，远方宫殿灯火辉煌。雪夜廊道，女子提灯与他对峙。",
    shots: [
      {id:1, file:"悬崖逃亡_01_远景_仰拍.png", shot_type:"远景", camera_angle:"仰拍", camera_movement:"固定", dialogue:"无对白", description_zh:"孤身攀爬陡峭悬崖，远处宫殿灯火辉煌，深谷云雾缭绕", duration:4},
      {id:2, file:"悬崖逃亡_02_中景_平拍.png", shot_type:"中景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"男子攀附悬崖边缘，伤痕累累紧抱布囊，风雪扑面", duration:3},
      {id:3, file:"悬崖逃亡_03_远景_平拍.png", shot_type:"远景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"攀岩者置身瀑布与悬崖之间，水雾弥漫，远景宫殿隐现", duration:4},
      {id:4, file:"悬崖逃亡_04_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"雪夜廊道对峙，受伤男子倚栏，女子提灯伸手指向他，情绪紧绷", duration:4}
    ]
  },
  {
    id: "fengbaosuolian", title: "风暴锁链", scene_num: 3,
    script: "铁链锁身，风暴瀑布。白发银甲人以锁链束缚悬空男子，冰雪山巅激烈牵制。",
    shots: [
      {id:1, file:"风暴锁链_01_中景_仰拍.png", shot_type:"中景", camera_angle:"仰拍", camera_movement:"固定", dialogue:"无对白", description_zh:"白发银甲人以铁链束缚悬空男子，风暴瀑布环绕，远处宫殿灯火", duration:4},
      {id:2, file:"风暴锁链_02_中景_仰拍.png", shot_type:"中景", camera_angle:"仰拍", camera_movement:"固定", dialogue:"无对白", description_zh:"男子被铁链捆绑奋力拉拽，身后银甲白发人站立雪岩，冰瀑轰鸣", duration:3}
    ]
  },
  {
    id: "shendianjiuyuan", title: "神殿救援", scene_num: 4,
    script: "雪山神殿废墟，女子刨开碎石瓦砾救出被困小猫。冰雪瀑布山谷，隐者立于崖边。",
    shots: [
      {id:1, file:"神殿救援_01_中景_俯拍.png", shot_type:"中景", camera_angle:"俯拍", camera_movement:"固定", dialogue:"无对白", description_zh:"女子雪夜刨开碎石瓦砾救出被困小猫和受伤人手，石灯暖光照亮", duration:4},
      {id:2, file:"神殿救援_02_全景_平拍.png", shot_type:"全景", camera_angle:"平拍", camera_movement:"固定", dialogue:"无对白", description_zh:"冰雪瀑布山谷，隐者立于崖边，远处雪山宫殿灯火闪烁", duration:4}
    ]
  }
];

// ===== BUILD SIDEBAR & SCENES =====
function buildGallery(){
  var nav=document.getElementById("sidebarNav");
  var container=document.getElementById("sceneContainer");
  var empty=document.getElementById("emptyState");
  var totalShots=0;

  if(STORYBOARD_DATA.length===0){
    empty.style.display="block";
    return;
  }
  empty.style.display="none";

  STORYBOARD_DATA.forEach(function(scene,i){
    // Sidebar link
    var a=document.createElement("a");
    a.href="#sec-"+scene.id;
    a.setAttribute("data-section","sec-"+scene.id);
    a.innerHTML='<span class="nav-emoji">🎬</span>'+scene.title+'<span class="nav-num">'+scene.shots.length+'镜</span>';
    nav.appendChild(a);

    // Scene section
    var sec=document.createElement("section");
    sec.className="scene-section";
    sec.id="sec-"+scene.id;

    var header='<div class="scene-header">'
      +'<h2>第'+scene.scene_num+'场 · '+scene.title+'</h2>'
      +'<div class="meta">'+scene.shots.length+' 镜 · '
      +scene.shots.map(function(s){return s.shot_type}).filter(function(v,i,a){return a.indexOf(v)===i}).join(' / ')
      +'</div></div>';

    // Script box
    if(scene.script){
      var lines=scene.script.split("\n");
      var truncated=lines.length>8;
      var visible=truncated?lines.slice(0,8).join("\n"):scene.script;
      header+='<div class="script-box" id="script-'+scene.id+'">'
        +'<button class="script-copy" onclick="event.stopPropagation();copyScript(\'script-'+scene.id+'\',this)">📋 复制</button>'
        +'<div class="script-text">'+visible.replace(/\n/g,"<br>")+'</div>';
      if(truncated){
        header+='<div class="script-full" style="display:none">'+scene.script.replace(/\n/g,"<br>")+'</div>'
          +'<div class="script-toggle" onclick="toggleScript(\'script-'+scene.id+'\',this)">▸ 展开完整剧本</div>';
      }
      header+='</div>';
    }

    // Shot grid
    var grid='<div class="shot-grid">';
    scene.shots.forEach(function(shot,j){
      grid+='<div class="shot-card" onclick="openLightbox('+i+','+j+')">'
        +'<img class="shot-img" src="'+scene.id+'/web/'+shot.file+'" alt="镜'+shot.id+'" loading="lazy">'
        +'<div class="shot-info">'
        +'<div class="shot-num">镜 '+shot.id+'</div>'
        +'<div class="shot-badges">'
        +'<span class="shot-badge type">'+shot.shot_type+'</span>'
        +'<span class="shot-badge angle">'+shot.camera_angle+'</span>'
        +(shot.camera_movement&&shot.camera_movement!=="固定"?'<span class="shot-badge move">'+shot.camera_movement+'</span>':'')
        +(shot.duration?'<span class="shot-badge">'+shot.duration+'s</span>':'')
        +'</div>'
        +(shot.description_zh?'<div class="shot-desc">'+shot.description_zh+'</div>':'')
        +(shot.dialogue&&shot.dialogue!=="无对白"?'<div class="shot-dialogue">💬 '+shot.dialogue+'</div>':'')
        +'</div></div>';
    });
    grid+='</div>';

    sec.innerHTML=header+grid;
    container.appendChild(sec);
    totalShots+=scene.shots.length;
  });

  document.getElementById("sidebarFooter").textContent=STORYBOARD_DATA.length+' 场 · '+totalShots+' 镜';
}

// ===== SCRIPT TOGGLE & COPY =====
function toggleScript(scriptId,btn){
  var box=document.getElementById(scriptId);
  var full=box.querySelector(".script-full");
  var text=box.querySelector(".script-text");
  if(full.style.display==="none"){
    full.style.display="block";text.style.display="none";
    btn.innerHTML="▾ 收起剧本";
  }else{
    full.style.display="none";text.style.display="block";
    btn.innerHTML="▸ 展开完整剧本";
  }
}

async function copyScript(scriptId,btn){
  var box=document.getElementById(scriptId);
  var full=box.querySelector(".script-full");
  var text=full&&full.style.display!=="none"?full:box.querySelector(".script-text");
  try{
    await navigator.clipboard.writeText(text.innerText);
    btn.textContent="✅ 已复制";btn.classList.add("copied");
    setTimeout(function(){btn.textContent="📋 复制";btn.classList.remove("copied")},2000);
  }catch(e){
    btn.textContent="❌ 失败";
    setTimeout(function(){btn.textContent="📋 复制"},2000);
  }
}

// ===== LIGHTBOX =====
var lbCurrentScene=-1,lbCurrentShot=-1;
function openLightbox(si,sj){
  lbCurrentScene=si;lbCurrentShot=sj;
  var shot=STORYBOARD_DATA[si].shots[sj];
  document.getElementById("lbImg").src=STORYBOARD_DATA[si].id+"/web/"+shot.file;
  document.getElementById("lbInfo").textContent="第"+STORYBOARD_DATA[si].scene_num+"场 · "
    +STORYBOARD_DATA[si].title+" — 镜"+shot.id+" · "+shot.shot_type+" · "+shot.camera_angle;
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow="hidden";
}

function closeLightbox(e){
  if(e&&e.target!==document.getElementById("lightbox")&&e.target.className==="lb-close"){}
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow="";
  lbCurrentScene=-1;lbCurrentShot=-1;
}

function navLightbox(dir){
  if(lbCurrentScene<0)return;
  var scene=STORYBOARD_DATA[lbCurrentScene];
  var newShot=lbCurrentShot+dir;
  if(newShot>=0&&newShot<scene.shots.length){
    openLightbox(lbCurrentScene,newShot);
  }
}

// ===== SCROLL SPY =====
var navLinks=null;
function updateActive(){
  if(!navLinks)navLinks=document.querySelectorAll(".sidebar-nav a");
  var sy=window.scrollY+160;
  var active=null;
  navLinks.forEach(function(a){
    var id=a.getAttribute("data-section");
    var el=id==="top"?null:document.getElementById(id);
    if(id==="top"&&sy<200){active=a}
    else if(el&&el.offsetTop<=sy){active=a}
  });
  if(active){
    navLinks.forEach(function(a){a.classList.remove("active")});
    active.classList.add("active");
  }
}
window.addEventListener("scroll",updateActive);

// ===== MOBILE SIDEBAR =====
function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("mobile-open");
}
document.getElementById("sidebar").addEventListener("click",function(e){
  if(e.target.tagName==="A"&&window.innerWidth<=900){
    this.classList.remove("mobile-open");
  }
});

// ===== INIT =====
buildGallery();
updateActive();

// Keyboard: Escape closes lightbox, arrows navigate
document.addEventListener("keydown",function(e){
  if(document.getElementById("lightbox").classList.contains("open")){
    if(e.key==="Escape")closeLightbox();
    if(e.key==="ArrowLeft")navLightbox(-1);
    if(e.key==="ArrowRight")navLightbox(1);
  }
});
</script>
