<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分镜故事板 · 狐祖归来 EP01 祖祠高潮</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#0a0a14;color:#ede4d4;font-family:"PingFang SC","Noto Serif SC","STSong","Songti SC",serif;min-height:100vh;overflow-x:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:210px;background:linear-gradient(180deg,#0d1025 0%,#0a0d1a 100%);border-right:1px solid rgba(180,160,120,.12);z-index:100;display:flex;flex-direction:column;padding:28px 0 20px}
.sidebar-brand{padding:0 22px 20px;font-size:18px;letter-spacing:.15em;color:#d4c8a0;text-align:center;border-bottom:1px solid rgba(180,160,120,.1);margin-bottom:16px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:4px;padding:0 10px}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:14px;letter-spacing:.08em;color:rgba(200,180,150,.55);text-decoration:none;border-radius:6px;transition:all .25s}
.sidebar-nav a:hover{color:#d4c8a0;background:rgba(200,170,120,.06)}
.sidebar-nav a.active{color:#e0d4b0;background:rgba(200,170,120,.1);border:1px solid rgba(200,170,120,.2)}
.sidebar-nav .nav-icon{font-size:16px;width:22px;text-align:center}
.sidebar-subnav{margin-top:8px;padding:0 10px;border-top:1px solid rgba(180,160,120,.08);overflow-y:auto;flex:1}
.sidebar-subnav .subnav-label{padding:12px 14px 6px;font-size:11px;letter-spacing:.15em;color:rgba(180,160,120,.3)}
.sidebar-subnav a{display:flex;align-items:center;gap:6px;padding:5px 14px;font-size:12px;letter-spacing:.05em;color:rgba(180,150,120,.35);text-decoration:none;border-radius:4px;transition:all .2s;margin:1px 0}
.sidebar-subnav a:hover{color:#c8b890;background:rgba(200,170,120,.04)}
.sidebar-subnav a.active{color:#d4c8a0;background:rgba(200,170,120,.08);border:1px solid rgba(200,170,120,.15)}
.sidebar-toggle{display:none;position:fixed;left:16px;top:16px;z-index:200;font-size:24px;color:rgba(200,170,130,.6);cursor:pointer;background:none;border:none;padding:6px;line-height:1}
.sidebar-toggle:hover{color:rgba(220,190,130,.9)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.body-wrap{margin-left:210px}

.hero{position:relative;text-align:center;padding:60px 20px 40px;background:linear-gradient(180deg,#0d1020 0%,#12182b 40%,#0a0a14 100%);border-bottom:1px solid rgba(180,160,120,.15);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1px 1px at 10% 20%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 30% 60%,rgba(255,255,255,.4),transparent),radial-gradient(1.5px 1.5px at 55% 15%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 70% 40%,rgba(255,255,255,.3),transparent),radial-gradient(1.5px 1.5px at 85% 70%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 15% 80%,rgba(255,255,255,.4),transparent);pointer-events:none}
.hero h1{position:relative;font-size:clamp(36px,6vw,56px);font-weight:300;letter-spacing:.15em;color:#e0d4b8;text-shadow:0 0 40px rgba(220,190,130,.35);margin-bottom:8px}
.hero .ep-title{position:relative;font-size:18px;letter-spacing:.3em;color:rgba(200,180,140,.55);margin-bottom:6px}
.hero .subtitle{position:relative;font-size:14px;letter-spacing:.2em;color:rgba(190,160,120,.45)}

.section-block{max-width:1400px;margin:0 auto;padding:0 24px}
.section-title{display:flex;align-items:center;gap:14px;margin:52px 0 24px}
.section-title:first-of-type{margin-top:36px}
.section-title .line{flex:1;height:1px;background:rgba(180,160,120,.2)}
.section-title h2{font-size:17px;font-weight:400;letter-spacing:.2em;color:rgba(210,190,160,.65);white-space:nowrap}

.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:24px;align-items:start;padding-bottom:8px}
.card{position:relative;background:#111524;border:1px solid rgba(140,120,80,.2);border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(180,140,80,.4)}
.card .img-container{width:100%;overflow:hidden;background:#0a0d16}
.card .img-container img{width:100%;height:auto;display:block;transition:transform .4s}
.card:hover img{transform:scale(1.02)}
.card .label{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(180deg,rgba(17,21,36,0) 0%,#111524 100%)}
.card .label .scene-name{font-size:16px;color:#d4c8a8;letter-spacing:.05em}
.card .label .scene-script{font-size:13px;color:rgba(210,190,160,.55);letter-spacing:.03em;line-height:1.6;text-align:right}

.lightbox{display:none;position:fixed;inset:0;z-index:1000;background:rgba(5,5,15,.95);backdrop-filter:blur(10px);justify-content:center;align-items:center;flex-direction:column}
.lightbox.active{display:flex}
.lightbox img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:4px}
.lightbox .lb-info{margin-top:14px;font-size:15px;color:rgba(215,200,170,.75);text-align:center;max-width:700px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:48px;color:rgba(215,200,170,.45);cursor:pointer;padding:20px;z-index:1001}
.lb-nav:hover{color:rgba(230,215,180,.9)}
.lb-prev{left:20px}.lb-next{right:20px}
.lightbox .lb-close{position:absolute;top:24px;right:36px;font-size:42px;color:rgba(215,200,170,.55);cursor:pointer}
.lightbox .lb-close:hover{color:rgba(230,215,180,.9)}
.footer{text-align:center;padding:50px 20px;font-size:13px;color:rgba(150,130,90,.35);letter-spacing:.15em}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .sidebar-toggle{display:block}.sidebar-overlay.show{display:block}
  .body-wrap{margin-left:0}.gallery{grid-template-columns:1fr}
}
</style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<nav class="sidebar" id="sidebar">

  <div class="sidebar-nav">
    <a href="../"><span class="nav-icon">🏠</span> 首页</a>

    <a href="../light-ratio/"><span class="nav-icon">💡</span> 光比图</a>
    <a href="../cine-ref/"><span class="nav-icon">🎬</span> 摄影参考</a>
    <a href="./" class="active"><span class="nav-icon">🎞️</span> 分镜板</a>
  </div>
  <div class="sidebar-subnav" id="subnav"></div>
</nav>

<div class="body-wrap">

<header class="hero">
  <p class="ep-title">狐祖归来 · EP01 · 祖祠高潮</p>
  <h1>分 镜 故 事 板</h1>
  <p class="subtitle">MV-S027–MV-S045 · 19镜 · 三格A→B→C · WIP审阅版</p>
</header>

<div id="content-root"></div>

<div class="lightbox" id="lightbox">
  <span class="lb-close" id="lbClose">&times;</span>
  <span class="lb-nav lb-prev" id="lbPrev">&#8249;</span>
  <img src="" alt="" id="lbImg">
  <div class="lb-info" id="lbInfo"></div>
  <span class="lb-nav lb-next" id="lbNext">&#8250;</span>
</div>
<div class="footer">狐 祖 归 来 · 祖 祠 高 潮 · 分 镜 故 事 板 · WIP 审 阅 版</div>

</div>

<script>
const scenes=[
// ═══ 总览 ═══
{file:"00_19镜故事板总览_WIP.jpg",name:"19镜总览 · 一页全览",script:"MV-S027→MV-S045 完整故事板总览——影门→虚无试炼→狐祖降临→九尾圣域→血脉觉醒→竖瞳→神域裂隙→降临→九尾虚空",section:"📋 总览",wide:true},

// ═══ 影门→试炼→降临 ═══
{file:"MV-S027_T35a生门·影门_三格故事板_WIP.png",name:"S027 · 生门·影门",script:"T35a — 影自身裂开为门，裂缝指向现实祖祠",section:"🌑 影门→试炼→降临"},
{file:"MV-S028_T35b虚无试炼_三格故事板_WIP.png",name:"S028 · 虚无试炼",script:"T35b — 脱离现实物理的无尽黑暗，漂浮山体碎片与冻结时间",section:"🌑 影门→试炼→降临"},
{file:"MV-S029_T35c狐祖影子降临_三格故事板_WIP.png",name:"S029 · 狐祖影子降临",script:"T35c — 不可理解的九尾巨影先于实体抵达",section:"🌑 影门→试炼→降临"},

// ═══ 九尾圣域 ═══
{file:"MV-S030_T36a九尾圣域显现_三格故事板_WIP.png",name:"S030 · 九尾圣域显现",script:"T36a — 九道巨型黑色岩层尾脉构成狐祖本体空间",section:"🦊 九尾圣域"},
{file:"MV-S031_T36b九尾巨石近景_三格故事板_WIP.png",name:"S031 · 九尾巨石近景",script:"T36b — 黑玉碎岩道逼近祖源，巨尾岩层低垂",section:"🦊 九尾圣域"},
{file:"MV-S032_T36c血脉核心觉醒_三格故事板_WIP.png",name:"S032 · 血脉核心觉醒",script:"T36c — 九尾汇聚处活性祖源，岩层血脉苏醒",section:"🦊 九尾圣域"},

// ═══ 祖碑与觉醒 ═══
{file:"MV-S033_T37祖碑裂竖缝_三格故事板_WIP.png",name:"S033 · 祖碑裂竖缝",script:"T37 — 无字祖碑裂开竖缝，圣域态显化",section:"⚡ 祖碑与觉醒"},
{file:"MV-S034_T38血脉觉醒材质_三格故事板_WIP.png",name:"S034 · 血脉觉醒材质",script:"T38 — 岩层血脉纹理苏醒，黑玉活化",section:"⚡ 祖碑与觉醒"},
{file:"MV-S035_T39雪娘尺度验证_三格故事板_WIP.png",name:"S035 · 雪娘尺度验证",script:"T39 — 雪娘仅作微小比例点，被圣域吞没",section:"⚡ 祖碑与觉醒"},
{file:"MV-S036_祖祠孤灯复燃_三格故事板_WIP.png",name:"S036 · 祖祠孤灯复燃",script:"祖祠长明灯序列全部复燃——祖源觉醒信号",section:"⚡ 祖碑与觉醒"},

// ═══ 狐祖显形 ═══
{file:"MV-S037_九尾百兽图睁眼_三格故事板_WIP.png",name:"S037 · 九尾百兽图睁眼",script:"壁画中央九尾白狐睁眼——百兽同时苏醒",section:"🔥 狐祖显形"},
{file:"MV-S038_金色兽爪_三格故事板_WIP.png",name:"S038 · 金色兽爪",script:"祖源火中伸出金色兽爪——非血肉，是祖脉显形",section:"🔥 狐祖显形"},
{file:"MV-S039_狐耳显形_三格故事板_WIP.png",name:"S039 · 狐耳显形",script:"雪娘头顶狐耳由虚转实——血脉觉醒体征",section:"🔥 狐祖显形"},
{file:"MV-S040_竖瞳接通_三格故事板_WIP.png",name:"S040 · 竖瞳接通",script:"雪娘瞳孔裂变竖瞳——千年祖脉接通",section:"🔥 狐祖显形"},

// ═══ 降临 ═══
{file:"MV-S041_神域裂隙回到现实_三格故事板_WIP.png",name:"S041 · 神域裂隙回到现实",script:"圣域裂隙倒映现实祖祠——两个空间接通",section:"✨ 降临"},
{file:"MV-S042_降临者跨出裂隙_三格故事板_WIP.png",name:"S042 · 降临者跨出裂隙",script:"降临者从裂隙跨回现实——狐祖姿态",section:"✨ 降临"},
{file:"MV-S043_群体低首_三格故事板_WIP.png",name:"S043 · 群体低首",script:"祭礼平台所有狐族低首——至高血脉压制",section:"✨ 降临"},
{file:"MV-S044_九尾暗影起身_三格故事板_WIP.png",name:"S044 · 九尾暗影起身",script:"暗影九尾从地面起身——巨物压迫感",section:"✨ 降临"},
{file:"MV-S045_九尾遮蔽虚空_三格故事板_WIP.png",name:"S045 · 九尾遮蔽虚空",script:"九尾完全伸展开，遮蔽整个虚空——狐祖归来",section:"✨ 降临"},
];

const root=document.getElementById("content-root");
const doneSections=new Set();
let secIdx=0;
scenes.forEach((sc,i)=>{
const sec=sc.section;
if(!doneSections.has(sec)){
doneSections.add(sec);
const block=document.createElement("div");block.className="section-block";block.id="sec-"+secIdx;secIdx++;
const title=document.createElement("div");title.className="section-title";
const count=scenes.filter(s=>s.section===sec).length;
title.innerHTML=`<div class="line"></div><h2>▎${sec} <span style="font-size:12px;color:rgba(180,160,120,.35);letter-spacing:.06em">${count} 镜</span></h2><div class="line"></div>`;
block.appendChild(title);
const gallery=document.createElement("div");gallery.className="gallery";gallery.setAttribute("data-section",sec);
block.appendChild(gallery);
root.appendChild(block);
}
const gal=root.querySelector(`[data-section="${sec}"]`);
const card=document.createElement("div");card.className="card";if(sc.wide)card.classList.add("wide-card");card.setAttribute("data-index",i);
card.innerHTML=`<div class="img-container"><img src="${sc.file}" alt="${sc.name}" loading="lazy"></div><div class="label"><div class="scene-name">${sc.name}</div><div class="scene-script">${sc.script}</div></div>`;
card.addEventListener("click",()=>openLightbox(i));
gal.appendChild(card);
});

const subnav=document.getElementById("subnav"),sections=[];
subnav.innerHTML='<div class="subnav-label">场次分组</div>';
doneSections.forEach(sec=>{const id="sec-"+sections.length;sections.push({id,sec});const a=document.createElement("a");a.href="#"+id;a.textContent=sec;subnav.appendChild(a)});
function updateActiveNav(){const els=subnav.querySelectorAll("a");let active=0;for(let i=els.length-1;i>=0;i--){const s=document.getElementById("sec-"+i);if(s&&s.getBoundingClientRect().top<window.innerHeight*.7){active=i;break}}els.forEach((a,i)=>{a.classList.toggle("active",i===active)})}
window.addEventListener("scroll",updateActiveNav,{passive:true});updateActiveNav();

const lightbox=document.getElementById("lightbox"),lbImg=document.getElementById("lbImg"),lbInfo=document.getElementById("lbInfo");
let cur=0;
function openLightbox(i){cur=i;updateLb();lightbox.classList.add("active");document.body.style.overflow="hidden"}
function closeLightbox(){lightbox.classList.remove("active");document.body.style.overflow=""}
function updateLb(){var s=scenes[cur];lbImg.src=s.file;lbInfo.innerHTML=`<b>${s.name}</b> · ${cur+1}/${scenes.length}<br><span style="font-size:14px;color:rgba(180,160,120,.5)">${s.script}</span>`}
function prev(){cur=(cur-1+scenes.length)%scenes.length;updateLb()}
function next(){cur=(cur+1)%scenes.length;updateLb()}
document.getElementById("lbClose").addEventListener("click",closeLightbox);
document.getElementById("lbPrev").addEventListener("click",e=>{e.stopPropagation();prev()});
document.getElementById("lbNext").addEventListener("click",e=>{e.stopPropagation();next()});
lightbox.addEventListener("click",e=>{if(e.target===lightbox)closeLightbox()});
document.addEventListener("keydown",e=>{if(!lightbox.classList.contains("active"))return;if(e.key==="Escape")closeLightbox();if(e.key==="ArrowLeft")prev();if(e.key==="ArrowRight")next()});
function toggleSidebar(){var s=document.getElementById("sidebar"),o=document.getElementById("sidebarOverlay");s.classList.toggle("open");o.classList.toggle("show")}
</script>
</body>
</html>
